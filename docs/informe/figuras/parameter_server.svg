<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="Liberation Sans" font-size="15">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8860b"/></marker></defs>
<rect width="1100" height="470" fill="#fff"/>
<text x="550" y="30" text-anchor="middle" font-size="19" font-weight="bold">Entrenamiento con paralelismo de datos (patrón parameter server)</text>
<rect x="40" y="150" width="270" height="170" rx="10" fill="#e3edf9" stroke="#1f5fa8"/>
<text x="175" y="180" text-anchor="middle" font-weight="bold">Coordinador</text>
<text x="175" y="205" text-anchor="middle" font-size="13">único dueño de los pesos w</text>
<text x="175" y="230" text-anchor="middle" font-size="13">1. difunde una copia de w</text>
<text x="175" y="252" text-anchor="middle" font-size="13">3. barrera: espera N parciales</text>
<text x="175" y="274" text-anchor="middle" font-size="13">4. suma en orden fijo (reduce)</text>
<text x="175" y="296" text-anchor="middle" font-size="13">5. w ← w − η·(∇ + λw)</text>
<g font-size="13">
<rect x="620" y="60" width="240" height="80" rx="8" fill="#d8ecd8" stroke="#2e7d32"/><text x="740" y="88" text-anchor="middle" font-weight="bold">Worker 1</text><text x="740" y="110" text-anchor="middle">2. gradiente parcial (map)</text><text x="740" y="128" text-anchor="middle">sobre su fragmento</text>
<rect x="620" y="195" width="240" height="80" rx="8" fill="#d8ecd8" stroke="#2e7d32"/><text x="740" y="223" text-anchor="middle" font-weight="bold">Worker 2</text><text x="740" y="245" text-anchor="middle">2. gradiente parcial (map)</text><text x="740" y="263" text-anchor="middle">sobre su fragmento</text>
<rect x="620" y="330" width="240" height="80" rx="8" fill="#d8ecd8" stroke="#2e7d32"/><text x="740" y="358" text-anchor="middle" font-weight="bold">Worker N</text><text x="740" y="380" text-anchor="middle">2. gradiente parcial (map)</text><text x="740" y="398" text-anchor="middle">sobre su fragmento</text>
<rect x="900" y="60" width="160" height="80" rx="8" fill="#fafafa" stroke="#999"/><text x="980" y="95" text-anchor="middle">Fragmento 1</text><text x="980" y="115" text-anchor="middle">filas [0, n/N)</text>
<rect x="900" y="195" width="160" height="80" rx="8" fill="#fafafa" stroke="#999"/><text x="980" y="230" text-anchor="middle">Fragmento 2</text><text x="980" y="250" text-anchor="middle">(solo lectura)</text>
<rect x="900" y="330" width="160" height="80" rx="8" fill="#fafafa" stroke="#999"/><text x="980" y="365" text-anchor="middle">Fragmento N</text><text x="980" y="385" text-anchor="middle">filas [(N−1)n/N, n)</text>
</g>
<line x1="860" y1="100" x2="898" y2="100" stroke="#999" stroke-width="2"/>
<line x1="860" y1="235" x2="898" y2="235" stroke="#999" stroke-width="2"/>
<line x1="860" y1="370" x2="898" y2="370" stroke="#999" stroke-width="2"/>
<line x1="310" y1="200" x2="618" y2="90" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="310" y1="225" x2="618" y2="225" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="310" y1="250" x2="618" y2="350" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="618" y1="120" x2="312" y2="215" stroke="#b8860b" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#b)"/>
<line x1="618" y1="255" x2="312" y2="255" stroke="#b8860b" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#b)"/>
<line x1="618" y1="390" x2="312" y2="290" stroke="#b8860b" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#b)"/>
<text x="440" y="120" text-anchor="middle" font-size="13">tareas[w] ← (copia de w, rango)</text>
<text x="465" y="405" text-anchor="middle" font-size="13" fill="#8a6508">respuestas ← (id, ∇ parcial, pérdida)</text>
<text x="550" y="455" text-anchor="middle" font-size="13">En la PC4 cada worker pasa a ser un nodo del clúster y los canales se reemplazan por conexiones TCP.</text>
</svg>
