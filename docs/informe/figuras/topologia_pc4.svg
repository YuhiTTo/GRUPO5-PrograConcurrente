<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="Liberation Sans" font-size="15"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="1100" height="620" fill="#fff"/>
<text x="550" y="30" text-anchor="middle" font-size="19" font-weight="bold">Topología de despliegue PC4 (Docker Compose, red bridge interna)</text>
<rect x="190" y="55" width="880" height="520" rx="12" fill="#fafafa" stroke="#999" stroke-dasharray="6,4"/><text x="205" y="78" font-size="13" fill="#555">Red interna de Docker Compose</text>
<rect x="20" y="250" width="140" height="70" rx="8" fill="#fff3e0" stroke="#e65100"/><text x="90.0" y="272" text-anchor="middle" font-weight="bold">Cliente</text><text x="90.0" y="292" text-anchor="middle" font-size="13">Postman / Swagger</text><text x="90.0" y="310" text-anchor="middle" font-size="13">navegador</text>
<rect x="230" y="230" width="200" height="110" rx="8" fill="#d8ecd8" stroke="#2e7d32"/><text x="330.0" y="252" text-anchor="middle" font-weight="bold">api (Go :8080)</text><text x="330.0" y="272" text-anchor="middle" font-size="13">REST + Swagger /docs</text><text x="330.0" y="290" text-anchor="middle" font-size="13">carga el modelo PC3</text><text x="330.0" y="308" text-anchor="middle" font-size="13">1 vez al iniciar</text>
<rect x="520" y="95" width="190" height="94" rx="8" fill="#fde8e8" stroke="#b71c1c"/><text x="615.0" y="117" text-anchor="middle" font-weight="bold">redis :6379</text><text x="615.0" y="137" text-anchor="middle" font-size="13">caché: predicciones</text><text x="615.0" y="155" text-anchor="middle" font-size="13">y lecturas por id</text><text x="615.0" y="173" text-anchor="middle" font-size="13">TTL 10 min</text>
<rect x="520" y="420" width="190" height="94" rx="8" fill="#e8f5e9" stroke="#1b5e20"/><text x="615.0" y="442" text-anchor="middle" font-weight="bold">mongo :27017</text><text x="615.0" y="462" text-anchor="middle" font-size="13">persistente</text><text x="615.0" y="480" text-anchor="middle" font-size="13">compras_publicas_pc4</text><text x="615.0" y="498" text-anchor="middle" font-size="13">predicciones</text>
<rect x="800" y="230" width="230" height="110" rx="8" fill="#e3edf9" stroke="#1f5fa8"/><text x="915.0" y="252" text-anchor="middle" font-weight="bold">coordinador (Go :9000)</text><text x="915.0" y="272" text-anchor="middle" font-size="13">AdamW, pesos globales</text><text x="915.0" y="290" text-anchor="middle" font-size="13">reparte rangos de lotes</text><text x="915.0" y="308" text-anchor="middle" font-size="13">reduce gradientes</text>
<rect x="800" y="400" width="110" height="70" rx="8" fill="#ede7f6" stroke="#4527a0"/><text x="855.0" y="422" text-anchor="middle" font-weight="bold">worker-1</text><text x="855.0" y="442" text-anchor="middle" font-size="13">2 goroutines</text>
<rect x="920" y="400" width="110" height="70" rx="8" fill="#ede7f6" stroke="#4527a0"/><text x="975.0" y="422" text-anchor="middle" font-weight="bold">worker-2</text><text x="975.0" y="442" text-anchor="middle" font-size="13">2 goroutines</text>
<rect x="800" y="490" width="110" height="70" rx="8" fill="#ede7f6" stroke="#4527a0"/><text x="855.0" y="512" text-anchor="middle" font-weight="bold">worker-3</text><text x="855.0" y="532" text-anchor="middle" font-size="13">2 goroutines</text>
<rect x="920" y="490" width="110" height="70" rx="8" fill="#ede7f6" stroke="#4527a0"/><text x="975.0" y="512" text-anchor="middle" font-weight="bold">worker-4</text><text x="975.0" y="532" text-anchor="middle" font-size="13">2 goroutines</text>
<line x1="160" y1="285" x2="230" y2="285" stroke="#333" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="195.0" y="279.0" text-anchor="middle" font-size="12">HTTP</text>
<line x1="375" y1="230" x2="560" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="440" y="190" text-anchor="middle" font-size="12">GET/SET</text>
