<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Liberation Sans" font-size="15">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1100" height="560" fill="#fff"/>
<text x="550" y="30" text-anchor="middle" font-size="19" font-weight="bold">Arquitectura de la solución (Caso 4: riesgo en compras públicas)</text>
<!-- legend -->
<rect x="40" y="48" width="18" height="14" fill="#d8ecd8" stroke="#2e7d32"/><text x="64" y="60" font-size="13">Implementado en la PC3</text>
<rect x="240" y="48" width="18" height="14" fill="#f4f4f4" stroke="#888" stroke-dasharray="5,3"/><text x="264" y="60" font-size="13">Previsto para la PC4 y el TB2</text>
<!-- data -->
<rect x="30" y="100" width="190" height="110" rx="8" fill="#e3edf9" stroke="#1f5fa8"/>
<text x="125" y="128" text-anchor="middle" font-weight="bold">Datos abiertos OECE</text>
<text x="125" y="152" text-anchor="middle" font-size="13">main.csv (2.76 M filas)</text>
<text x="125" y="172" text-anchor="middle" font-size="13">tender_items.csv (5.15 M)</text>
<text x="125" y="192" text-anchor="middle" font-size="13">Formato OCDS</text>
<!-- A -->
<rect x="270" y="90" width="230" height="130" rx="8" fill="#d8ecd8" stroke="#2e7d32"/>
<text x="385" y="116" text-anchor="middle" font-weight="bold">A. Carga y limpieza</text>
<text x="385" y="136" text-anchor="middle" font-weight="bold">concurrente</text>
<text x="385" y="160" text-anchor="middle" font-size="13">goroutines + canales</text>
<text x="385" y="180" text-anchor="middle" font-size="13">productor → workers →</text>
<text x="385" y="198" text-anchor="middle" font-size="13">agregador único</text>
<!-- dataset -->
<rect x="550" y="100" width="190" height="110" rx="8" fill="#d8ecd8" stroke="#2e7d32"/>
<text x="645" y="128" text-anchor="middle" font-weight="bold">Dataset etiquetado</text>
<text x="645" y="152" text-anchor="middle" font-size="13">2.46 M procesos</text>
<text x="645" y="172" text-anchor="middle" font-size="13">riesgo = 1: desierto</text>
<text x="645" y="192" text-anchor="middle" font-size="13">o cancelado (20.6 %)</text>
<!-- B -->
<rect x="790" y="90" width="280" height="130" rx="8" fill="#d8ecd8" stroke="#2e7d32"/>
<text x="930" y="116" text-anchor="middle" font-weight="bold">B. Entrenamiento paralelo</text>
<text x="930" y="140" text-anchor="middle" font-size="13">Regresión logística (y Random Forest)</text>
<text x="930" y="160" text-anchor="middle" font-size="13">Coordinador + N workers</text>
<text x="930" y="180" text-anchor="middle" font-size="13">(parameter server sobre canales)</text>
<text x="930" y="200" text-anchor="middle" font-size="13">→ modelo JSON</text>
<line x1="220" y1="155" x2="268" y2="155" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="500" y1="155" x2="548" y2="155" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="740" y1="155" x2="788" y2="155" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<!-- future row -->
<rect x="790" y="300" width="280" height="110" rx="8" fill="#f4f4f4" stroke="#888" stroke-dasharray="6,4"/>
<text x="930" y="328" text-anchor="middle" font-weight="bold">Clúster de nodos ML</text>
<text x="930" y="352" text-anchor="middle" font-size="13">Cada nodo entrena su fragmento</text>
<text x="930" y="372" text-anchor="middle" font-size="13">y envía gradientes por TCP</text>
<text x="930" y="392" text-anchor="middle" font-size="13">(contenedores Docker)</text>
<rect x="470" y="300" width="270" height="110" rx="8" fill="#f4f4f4" stroke="#888" stroke-dasharray="6,4"/>
<text x="605" y="328" text-anchor="middle" font-weight="bold">C. API coordinadora en Go</text>
<text x="605" y="352" text-anchor="middle" font-size="13">REST + WebSocket, JWT</text>
<text x="605" y="372" text-anchor="middle" font-size="13">predicción en menos de 100 ms</text>
<text x="605" y="392" text-anchor="middle" font-size="13">coordina el clúster vía TCP</text>
<rect x="470" y="450" width="270" height="80" rx="8" fill="#f4f4f4" stroke="#888" stroke-dasharray="6,4"/>
<text x="605" y="480" text-anchor="middle" font-weight="bold">Bases de datos</text>
<text x="605" y="505" text-anchor="middle" font-size="13">MongoDB (persistente) · Redis (caché)</text>
<rect x="160" y="300" width="250" height="110" rx="8" fill="#f4f4f4" stroke="#888" stroke-dasharray="6,4"/>
<text x="285" y="328" text-anchor="middle" font-weight="bold">D. Interfaz web (SPA)</text>
<text x="285" y="352" text-anchor="middle" font-size="13">Panel de riesgo e impacto social</text>
<text x="285" y="372" text-anchor="middle" font-size="13">Panel de administración</text>
<text x="285" y="392" text-anchor="middle" font-size="13">(métricas del clúster)</text>
<line x1="930" y1="220" x2="930" y2="298" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
<line x1="788" y1="355" x2="742" y2="355" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
<line x1="742" y1="370" x2="788" y2="370" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
<line x1="468" y1="355" x2="412" y2="355" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
<line x1="605" y1="410" x2="605" y2="448" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="765" y="345" text-anchor="middle" font-size="12">TCP</text>
<text x="440" y="345" text-anchor="middle" font-size="12">JSON/WS</text>
</svg>
